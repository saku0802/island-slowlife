<!DOCTYPE html>
<html lang="ja">
<head>
<link rel="icon" href="assets/favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#173f45">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>無人島スローライフ</title>
<style>
:root{--ink:#2a1a10;--wood:#8a5a2c;--wood2:#b07a42;--wood3:#d9a86a;--paper:#f6e7c4;--paper2:#ead3a2;--leaf:#5d8a2c;--sea:#1f6f78;--coral:#f0705a;--gold:#f2c440;--sub:#6a4a2a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#173f45;color:var(--ink);font-family:system-ui,-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic UI',Meiryo,sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%}
#cv{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;image-rendering:pixelated}
.ic{display:inline-block;vertical-align:middle;background-image:url(assets/atlas.png);background-repeat:no-repeat;image-rendering:pixelated;flex:none}
.ic.sil{filter:brightness(0) opacity(.35)}
.hidden{display:none!important}
button{font:inherit;color:inherit;touch-action:manipulation}
/* 木のパネル */
.wood{border:8px solid transparent;border-image:url(assets/ui_panel.png) 10 fill / 8px stretch;image-rendering:pixelated;color:#fff3d6;text-shadow:0 1px 0 #3a2210}
.board{border:12px solid transparent;border-image:url(assets/ui_board.png) 12 fill / 12px stretch;image-rendering:pixelated}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{pointer-events:auto}
#top{position:absolute;left:max(6px,env(safe-area-inset-left));right:max(6px,env(safe-area-inset-right));top:max(4px,env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#isle{min-width:0;max-width:150px;padding:0 4px;line-height:1.1;font-size:12px;white-space:nowrap;overflow:hidden}
#isle b{display:block;font-size:13px}#isle small{font-size:10px;opacity:.85}
#chips{display:flex;gap:4px;flex:1;min-width:0;flex-wrap:nowrap}
.chip{display:flex;align-items:center;gap:3px;background:rgba(40,24,12,.78);border:2px solid #6a4020;border-radius:8px;padding:2px 6px 2px 3px;min-width:0;color:#fff3d6;box-shadow:inset 0 1px 0 rgba(255,220,160,.25)}
.chip b{display:block;font-size:13px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip small{display:block;font-size:9px;opacity:.8;line-height:1;white-space:nowrap;color:#cfe8b0}
#menu{display:flex;gap:3px;margin-left:auto}
.mbtn{position:relative;width:46px;height:46px;border-radius:10px;border:2px solid #3a2210;background:linear-gradient(#c98e52,#8a5a2c);box-shadow:inset 0 2px 0 rgba(255,230,180,.5),inset 0 -3px 0 rgba(60,30,10,.4),0 2px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#fff3d6;text-shadow:0 1px 0 #3a2210}
.mbtn span{font-size:9px;font-weight:800;line-height:1;margin-top:1px}
.mbtn:active{transform:translateY(1px)}
.dot{position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--coral);border:2px solid #fff3d6;display:none}
.dot.on{display:block;animation:pop 1.2s infinite}
@keyframes pop{50%{transform:scale(1.25)}}
#goal{position:absolute;left:max(6px,env(safe-area-inset-left));top:calc(max(4px,env(safe-area-inset-top)) + 50px);width:min(270px,36vw);padding:2px 6px;cursor:pointer;font-size:12px}
#goal .gh{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:800;color:#ffe08a;letter-spacing:.05em}
#gtext{font-weight:800;line-height:1.25;font-size:12.5px}
#goal .bar{height:6px;background:rgba(0,0,0,.4);border-radius:3px;margin:3px 0 2px;overflow:hidden}
#gbar{height:100%;background:linear-gradient(90deg,#8fd14f,#f2c440);width:0;transition:width .3s}
#gsub{font-size:10.5px;opacity:.95;min-height:13px}
#goal.ready{animation:glow 1.2s infinite}
#goal.pulse{animation:gpulse .6s}
@keyframes glow{50%{filter:brightness(1.25) drop-shadow(0 0 6px #ffe08a)}}
@keyframes gpulse{30%{transform:scale(1.06)}}
.cs{display:inline-flex;align-items:center;gap:1px;margin-right:6px;white-space:nowrap;font-weight:800;font-variant-numeric:tabular-nums}
.cs.ng{color:#d0402a}
#goal .cs.ng{color:#ffb0a0}
#buffs{position:absolute;left:max(6px,env(safe-area-inset-left));top:calc(max(4px,env(safe-area-inset-top)) + 128px);display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:36vw}
.buff{background:rgba(30,20,50,.75);color:#e8e0ff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;border:1px solid #8a7ad0;width:max-content}
#evb{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(4px,env(safe-area-inset-top)) + 52px);display:flex;align-items:center;gap:6px;padding:2px 10px;min-height:44px;cursor:pointer;animation:evb 1.4s infinite;font-weight:800;font-size:13px;text-align:left;max-width:46vw}
#evb small{display:block;font-size:10px;opacity:.85;font-weight:600}
@keyframes evb{50%{transform:translateX(-50%) translateY(2px);filter:brightness(1.2)}}
#toasts{position:absolute;left:50%;transform:translateX(-50%);bottom:max(10px,env(safe-area-inset-bottom));width:min(460px,50vw);display:flex;flex-direction:column;gap:4px;pointer-events:none;align-items:center}
.toast{background:rgba(42,26,14,.92);color:#fff3d6;border:2px solid #c98e52;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:tin .25s;max-width:100%}
.toast.t-ach{border-color:var(--gold);background:rgba(70,44,10,.94)}
.toast.t-dex{border-color:#5ab6e8}
.toast.out{opacity:0;transform:translateY(6px);transition:.35s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#joy{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));width:132px;height:132px;border-radius:50%;background:radial-gradient(circle,rgba(60,36,16,.35) 0 52%,#8a5a2c 53% 60%,#5a3418 61% 66%,rgba(0,0,0,0) 67%);touch-action:none;opacity:.92;display:none}
body.touch #joy{display:block}
#joyk{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d88a4a,#8a4a1e 60%,#4a2410);border:3px solid #2a1408;box-shadow:0 4px 0 rgba(0,0,0,.35);pointer-events:none}
#act{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;border:4px solid #2a1408;background:radial-gradient(circle at 40% 30%,#b08a5a,#6a4a2a);box-shadow:inset 0 4px 0 rgba(255,230,180,.35),inset 0 -6px 0 rgba(40,20,5,.45),0 4px 0 rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff3d6;font-weight:900;font-size:13px;text-shadow:0 1px 0 #2a1408;touch-action:none;cursor:pointer;opacity:.75}
#act.on{background:radial-gradient(circle at 40% 30%,#ffd27a,#e08a2a 60%,#a0501a);opacity:1;animation:actp 1.6s infinite}
#act.down{transform:scale(.93)}
@keyframes actp{50%{box-shadow:inset 0 4px 0 rgba(255,230,180,.35),inset 0 -6px 0 rgba(40,20,5,.45),0 4px 0 rgba(0,0,0,.4),0 0 14px #ffd27a}}
body:not(.touch) #act{width:84px;height:84px;font-size:12px}
#act span{white-space:nowrap}
#keyhint{position:absolute;left:10px;bottom:8px;font-size:11px;color:#fff3d6;text-shadow:0 1px 2px #000;opacity:.8;pointer-events:none}
body.touch #keyhint{display:none}
/* パネル */
#panel{position:fixed;inset:0;background:rgba(10,20,25,.45);display:flex;align-items:center;justify-content:center;padding:max(6px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(6px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));z-index:20}
.pbox{width:min(860px,100%);height:min(640px,100%);display:flex;flex-direction:column;background-clip:padding-box}
.phead{display:flex;align-items:center;gap:8px;padding:0 0 4px}
.phead h2{margin:0;font-size:17px;flex:1;display:flex;align-items:center;gap:6px;color:#fff3d6;text-shadow:0 2px 0 #2a1408,0 0 4px #2a1408}
.x{width:44px;height:44px;border-radius:10px;border:2px solid #3a2210;background:linear-gradient(#e0705a,#a03a2a);color:#fff;font-size:24px;font-weight:900;line-height:1;cursor:pointer;box-shadow:inset 0 2px 0 rgba(255,220,200,.4),0 2px 0 rgba(0,0,0,.3)}
#ptabs{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;flex:none}
#ptabs button,.seg button{min-height:36px;padding:4px 12px;border-radius:8px;border:2px solid #6a4020;background:#e9cf9c;font-weight:800;font-size:13px;color:#4a2a12;cursor:pointer;white-space:nowrap}
#ptabs button.on,.seg button.on{background:#6a4020;color:#fff3d6}
.pbody{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:2px 4px 8px;background:rgba(246,231,196,.92);border-radius:6px;border:2px solid rgba(90,50,20,.4);touch-action:pan-y;-webkit-user-select:text;user-select:text}
.hint{font-size:12px;color:var(--sub);margin:6px 2px;line-height:1.5}
.hint.ok,.ok{color:#3c8a3a;font-weight:800}
.sec{font-weight:900;font-size:14px;margin:10px 2px 4px;color:#4a2a12;display:flex;align-items:center;gap:6px;border-bottom:2px dashed rgba(106,64,32,.35);padding-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:6px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px}
.card{display:flex;align-items:center;gap:8px;background:linear-gradient(#fff6e0,#f0dcb0);border:2px solid #b08050;border-radius:10px;padding:6px 8px;margin:4px 0;box-shadow:0 2px 0 rgba(90,50,20,.25)}
.grid2 .card,.grid3 .card{margin:0}
.card .bd{flex:1;min-width:0}
.card .t{font-weight:900;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.own{font-size:11px;background:#6a4020;color:#fff3d6;border-radius:8px;padding:1px 7px;font-weight:800}
.card .d{font-size:11.5px;color:var(--sub);line-height:1.45}
.card .d.now{color:#3c7a2a;font-weight:700}
.card .d.lock{color:#9a5a3a}
.card .cost{font-size:12px;margin-top:2px;line-height:1.6}
.card.locked{opacity:.65;filter:grayscale(.6)}
.card.done{background:linear-gradient(#e8f6d8,#cfe8b0);border-color:#6a9a40}
.card.no{opacity:.6}
.card.tgl{justify-content:space-between;font-weight:800;font-size:13px}
.card.danger{border-color:#c0503a}
.card.sm{padding:4px 6px}
.btns{display:flex;flex-direction:column;gap:4px}
.btns .btn{width:100%}
.card .btns{flex-direction:column}
.gm .btns{flex-direction:row;margin:4px 0}
.btn{min-height:44px;min-width:64px;padding:4px 12px;border-radius:10px;border:2px solid #3a2210;background:linear-gradient(#d9a86a,#a8723e);color:#fff8e8;font-weight:900;font-size:13px;text-shadow:0 1px 0 #3a2210;box-shadow:inset 0 2px 0 rgba(255,235,190,.5),inset 0 -3px 0 rgba(60,30,10,.35),0 2px 0 rgba(0,0,0,.3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;flex-direction:column;line-height:1.15}
.btn small{font-size:10.5px;font-weight:700;opacity:.92;line-height:1.3}
.btn.big{min-height:48px;font-size:14px}
.btn.can{background:linear-gradient(#9ad65a,#4f9a2a)}
.btn.on{background:linear-gradient(#9ad65a,#4f9a2a)}
.btn.gold{background:linear-gradient(#ffe08a,#e0a02a);color:#4a2a08;text-shadow:0 1px 0 #fff4c0}
.btn.red{background:linear-gradient(#f08a6a,#c0402a)}
.btn.sm{min-height:36px;font-size:12px}
.btn.wide{width:100%}
.btn:disabled{background:linear-gradient(#c8b8a0,#9a8a72);color:#f0e8dc;cursor:default;opacity:.85}
.btn:not(:disabled):active{transform:translateY(1px)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.bm{margin:2px 0 4px}
.cmds{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;margin:0 0 6px}
.cmd{min-height:52px;text-align:left;border-radius:10px;border:2px solid #8a5a2c;background:#f6e7c4;padding:4px 8px;cursor:pointer;display:flex;flex-direction:column}
.cmd b{font-size:13px}.cmd small{font-size:10.5px;color:var(--sub);line-height:1.3}
.cmd.on{background:#6a4020;color:#fff3d6;border-color:#3a2210}.cmd.on small{color:#f0d8b0}
.prog{height:8px;background:rgba(90,50,20,.25);border-radius:4px;overflow:hidden;margin:3px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#8fd14f,#f2c440)}
.rt{display:inline-block;font-size:10px;font-weight:900;padding:0 6px;border-radius:6px;color:#fff;margin-right:3px;line-height:1.6}
.rt.N{background:#8a8c86}.rt.R{background:#4f9a3a}.rt.SR{background:#8a4ad0}.rt.SSR{background:linear-gradient(90deg,#e0a02a,#f06a9a,#5ab6e8)}
.rates{margin:3px 0}
.pity{font-size:12px;font-weight:800;color:#8a3a2a}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.cc{border:6px solid transparent;border-image:url(assets/ui_card_N.png) 8 fill / 6px stretch;image-rendering:pixelated;padding:4px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;color:#fff;text-shadow:0 1px 0 #000}
.cc.R{border-image-source:url(assets/ui_card_R.png)}.cc.SR{border-image-source:url(assets/ui_card_SR.png)}.cc.SSR{border-image-source:url(assets/ui_card_SSR.png)}
.cc .cn{font-weight:900;font-size:12px}.cc .cd{font-size:10px;line-height:1.35}
.cc.unk{opacity:.55}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:5px}
.dx{background:#fff6e0;border:2px solid #c9a46a;border-radius:8px;padding:4px;text-align:center;display:flex;flex-direction:column;align-items:center}
.dx .dn{font-size:11.5px;font-weight:800}.dx .dc{font-size:10px;color:var(--sub)}
.dx.unk{background:#e8d8b8}
.ach .rw{color:#8a5a1a;font-weight:700}
.stat{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;padding:3px 0;border-bottom:1px dashed rgba(106,64,32,.25)}
.ms{display:flex;gap:8px;font-size:12px;padding:2px 0;opacity:.6}.ms.ok{opacity:1;color:#3c7a2a}.ms b{width:40px}
.tags{display:flex;flex-wrap:wrap;gap:4px}.tag{background:#fff6e0;border:1px solid #c9a46a;border-radius:8px;padding:2px 6px;font-size:12px;display:flex;align-items:center;gap:3px}
.col{display:flex;flex-direction:column;gap:4px}
/* モーダル */
#modal{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:rgba(10,20,25,.55);padding:8px}
#modal.hidden{display:none}
.mbox{width:min(560px,100%);max-height:100%;overflow-y:auto;background-clip:padding-box;text-align:left;font-size:13px;line-height:1.55;animation:mi .22s}
.mbox.tall{display:flex;flex-direction:column;overflow:hidden}
@keyframes mi{from{transform:scale(.92);opacity:0}}
.mbox{color:#fff3d6;text-shadow:0 1px 0 #2a1408,0 0 3px #2a1408}.mbox b{color:#ffe08a}
.mbox .gain,.mbox .howto>div,.mscroll{color:var(--ink);text-shadow:none}.mbox .gain b,.mbox .howto b,.mscroll b{color:var(--ink)}
.mscroll{background:rgba(246,231,196,.95);border-radius:6px;padding:4px 6px}
.mbox h2{margin:2px 0 4px;font-size:17px;text-align:center}
.mbox p{margin:4px 0}.c{text-align:center}.mbox .d{font-size:12px;color:#f0d8b0}.mscroll .d{color:var(--sub)}
.mart{display:flex;justify-content:center;gap:8px;margin:0 0 2px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.choices.isl{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.mhead{display:flex;align-items:center;gap:6px}.mhead h2{flex:1;text-align:left}
.mscroll{flex:1;overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.mfoot{padding-top:6px}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:2px 4px;border-bottom:1px solid rgba(106,64,32,.2);text-align:left}td.p{text-align:right;font-variant-numeric:tabular-nums}tr.rh th{background:rgba(106,64,32,.12)}
.gain{display:grid;gap:2px;margin:6px 0;background:rgba(255,246,224,.7);border-radius:8px;padding:6px 10px}
.gain>div{display:flex;justify-content:space-between;align-items:center}
.howto{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0;font-size:12px}
.howto>div{display:flex;gap:6px;align-items:center;background:rgba(255,246,224,.7);border-radius:8px;padding:4px 6px}
/* ガチャ */
#gacha{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 45%,#2a4a5a,#0a1218 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;overflow:hidden;touch-action:manipulation;cursor:pointer}
#gacha.hidden{display:none}
.gtitle{position:absolute;top:max(8px,env(safe-area-inset-top));font-weight:900;font-size:16px;letter-spacing:.1em;text-shadow:0 2px 0 #000}
.gglow{position:absolute;left:50%;top:48%;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);transition:all 1s}
.grays{position:absolute;left:50%;top:48%;width:160vmax;height:160vmax;transform:translate(-50%,-50%);opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.14) 0 8deg,transparent 8deg 22deg);transition:opacity .6s}
#gacha.opening .grays{opacity:.6;animation:spin 6s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
#gacha.opening .gglow{width:260px;height:260px;filter:blur(18px);background:#fff8}
#gacha.r-SR.opening .gglow{background:#c08af0}
#gacha.r-SSR.opening .gglow{background:radial-gradient(#fff,#ffd84a 40%,#f06a9a 70%,transparent);width:420px;height:420px;animation:ssr 0.5s infinite alternate}
#gacha.r-R.opening .gglow{background:#7ad06a}
@keyframes ssr{to{filter:blur(24px) hue-rotate(60deg)}}
.gobj{position:relative;background:none;border:0;padding:0;cursor:pointer;animation:bob 1.6s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
@keyframes bob{50%{transform:translateY(-8px)}}
#gacha.opening .gobj{animation:shake .12s infinite}
#gacha.r-SSR.opening .gobj{animation:shake .08s infinite;filter:drop-shadow(0 0 20px #ffd84a)}
@keyframes shake{25%{transform:translate(-3px,1px) rotate(-4deg)}75%{transform:translate(3px,-1px) rotate(4deg)}}
#gacha.revealed .gobj{display:none}
.ghint{position:absolute;bottom:calc(max(8px,env(safe-area-inset-bottom)) + 56px);font-weight:800;font-size:13px;opacity:.9;text-shadow:0 1px 0 #000}
.gbar{position:absolute;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px}
#gcard{position:relative;display:flex;justify-content:center}
.gc{width:200px;min-height:230px;border:10px solid transparent;border-image:url(assets/ui_card_N.png) 8 fill / 10px stretch;image-rendering:pixelated;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;animation:flip .5s;text-shadow:0 1px 0 #000}
.gc.R{border-image-source:url(assets/ui_card_R.png)}.gc.SR{border-image-source:url(assets/ui_card_SR.png);box-shadow:0 0 30px #c08af0}.gc.SSR{border-image-source:url(assets/ui_card_SSR.png);box-shadow:0 0 50px #ffd84a;animation:flip .5s,ssrc 1s infinite alternate}
@keyframes flip{from{transform:rotateY(90deg) scale(.7)}}
@keyframes ssrc{to{box-shadow:0 0 70px #f06a9a}}
.gc .gn{font-weight:900;font-size:17px}.gc .gt{font-size:11px;opacity:.95}.gc .gs{font-size:12px;font-weight:900;color:#ffe08a}

function suffix(e){
  if(e<=4) return ['','K','M','B','T'][e];
  let k=e-5,len=2,cnt=676;
  while(k>=cnt){k-=cnt;len++;cnt*=26;}
  let s='';
  for(let i=0;i<len;i++){s=String.fromCharCode(97+k%26)+s;k=Math.floor(k/26);}
  return s;
}
function fmt(n){
  if(n!==n) return '0';
  if(!isFinite(n)) return '∞';
  if(n<0) return '-'+fmt(-n);
  if(n<1000) return String(Math.floor(n));
  let e=Math.floor(Math.log10(n)/3);
  let m=n/Math.pow(10,e*3);
  if(m<1){e--;m*=1000;}
  if(m>=1000){e++;m/=1000;}
  const d=m<10?1:m<100?1:0;
  const p=Math.pow(10,d);
  const v=Math.floor(m*p+1e-9)/p;
  return v.toFixed(d)+suffix(e);
}
function fmtR(n){
  if(n<0) return '-'+fmtR(-n);
  if(n===0) return '0';
  if(n<1) return (Math.floor(n*100)/100).toFixed(2);
  if(n<10) return (Math.floor(n*10)/10).toFixed(1);

}

function isObj(o){return o&&typeof o==='object'&&!Array.isArray(o);}
function merge(def,d){
  for(const k in d){
    if(isObj(def[k])&&isObj(d[k])) def[k]=merge(def[k],d[k]);
    else if(d[k]!==undefined) def[k]=d[k];
  }
  return def;
}
const SAVE_KEY_V1='islandSlowLife_save_v1';
let storageOK=true, storageErr=null, lastSaveOkAt=0;
function isFileOrigin(){ return typeof location!=='undefined' && location.protocol==='file:'; }
function storageHint(){
  if(isFileOrigin()) return 'ファイルを直接開くと、スマホではセーブが残らないことがあります。httpsのページで開くか、「セーブコードを書き出す」で控えを取ってください。';
  return 'このブラウザでは保存できません（プライベートモードや制限の可能性）。「セーブコードを書き出す」で控えを取ってください。';
}
function notifySaveError(){
  if(typeof toast==='function') toast('セーブできませんでした。'+storageHint(),'warn');
}
function storageAvailable(){
  try{
    const k='__island_ping';
    localStorage.setItem(k,'1');
    if(localStorage.getItem(k)!=='1') throw new Error('noread');
    localStorage.removeItem(k);
    return true;
  }catch(e){ storageOK=false; storageErr=String(e&&e.message||e); return false; }
}
function migrateSave(d){
  if(!d||typeof d!=='object') return null;
  if(d.v===2) return d;
  if(d.v===1){ d.v=2; return d; }
  if(d.v){ d.v=2; return d; }
  return null;
}
function load(){
  S=defaultState();
  try{
    if(!storageAvailable()){ return false; }
    let raw=localStorage.getItem(SAVE_KEY), fromV1=false;
    if(!raw){ raw=localStorage.getItem(SAVE_KEY_V1); fromV1=!!raw; }
    if(raw){
      const d=migrateSave(JSON.parse(raw));
      if(d){
        S=merge(defaultState(),d);
        S.v=2;
        storageOK=true;
        if(fromV1){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
        return true;
      }
    }
  }catch(e){
    S=defaultState();
    storageOK=false;
    storageErr=String(e&&e.message||e);
  }
  return false;
}
let resetting=false;
function save(opts){
  opts=opts||{};
  if(resetting) return false;
  S.last=now();
  S.v=2;
  if(typeof snapshotWorld==='function') snapshotWorld();
  try{
    const raw=JSON.stringify(S);
    localStorage.setItem(SAVE_KEY,raw);
    const check=localStorage.getItem(SAVE_KEY);
    if(!check) throw new Error('empty');
    storageOK=true; storageErr=null; lastSaveOkAt=S.last;
    if(opts.toast&&typeof toast==='function') toast('セーブしました');
    return true;
  }catch(e){
    storageOK=false;
    storageErr=String(e&&e.message||e);
    if(opts.silent) return false;
    notifySaveError();
    return false;
  }
}
let saveSoonT=0;
function saveSoon(){ clearTimeout(saveSoonT); saveSoonT=setTimeout(()=>save(),400); }
function exportSaveCode(){
  if(typeof snapshotWorld==='function') snapshotWorld();
  S.last=now(); S.v=2;
  const json=JSON.stringify(S);
  try{ return btoa(unescape(encodeURIComponent(json))); }
  catch(e){ return json; }
}
function importSaveCode(code){
  if(!code||!String(code).trim()){ if(typeof toast==='function') toast('コードが空です','warn'); return false; }
  const t=String(code).trim();
  let d=null;
  try{ d=JSON.parse(t); }
  catch(e){
    try{ d=JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,''))))); }
    catch(e2){ if(typeof toast==='function') toast('セーブコードが読めませんでした','warn'); return false; }
  }
  d=migrateSave(d);
  if(!d){ if(typeof toast==='function') toast('このコードは使えません','warn'); return false; }
  S=merge(defaultState(),d);
  S.v=2;
  if(typeof newIsland==='function') newIsland();
  if(typeof closePanel==='function') closePanel();
  if(typeof closeModal==='function') closeModal();
  if(typeof updateHud==='function') updateHud();
  save({silent:true});
  if(typeof toast==='function') toast('セーブを読み込みました');
  return true;
}

const has=id=>!!S.research[id];
const resCount=()=>Object.keys(S.research).length;
const dexN=k=>Object.keys(S.dex[k]).length;
const fireStep=()=>has('firecraft')?0.2:0.1;
const partCost=()=>has('gears')?10:20;
function gb(){
  const s={global:0,tap:0,shell:0,helper:0,fac:0,offline:0,event:0,autotap:0,wood:0,stone:0,fish:0,fruit:0,parts:0};
  for(const id in S.gacha.owned){
    const it=GITEMS.find(x=>x.id===id); if(!it) continue;
    const lv=S.gacha.owned[id].lv;
    for(const [k,v] of it.eff) s[k]+=v*lv;
  }
  return s;
}
function achMult(){ let m=1; for(const a of ACH){ if(S.ach[a[0]]&&a[5].mult) m+=a[5].mult; } return m; }
function dexMult(){
  let m=1+0.02*(dexN('fish')+dexN('item'));
  if(dexN('fish')>=FISH.length) m*=1.5;
  if(dexN('item')>=ITEMS.length) m*=1.5;
  return m;
}
function tripMult(){ const t=S.meta.trips; return (t>=2?1.5:1)*(t>=10?3:1)*(t>=20?5:1)*(t>=30?10:1); }
function buffM(k){ let m=1; const t=now(); for(const b of S.buffs){ if(b.until>t&&b.k===k) m*=b.m; } return m; }
function msMult(n){ return Math.pow(2,Math.floor(n/25)); }
function toolLvOf(r){ const t=TOOLS.find(x=>x.res===r); return t?S.tools[t.id]:0; }
let nightFactor=0; // 描画側が更新（0..1）
function cmdWeight(h,r){
  const c=S.helpers[h.id].cmd;
  if(c==='rest') return 0;
  if(c==='care') return r==='parts'?1:1.25;
  if(c===r) return 1.6;
  if(['wood','fruit','stone','fish'].includes(c)&&h.prod[c]) return r==='parts'?1:0.4;
  return 1;
}
function calc(){
  const g=gb(), isl=ISLANDS[S.run.type], m=S.meta;
  const D={g};
  let global=(1+S.fac.fire*fireStep())*achMult()*dexMult()*(1+g.global)*(1+0.25*m.compass)*(1+0.15*m.flower)*tripMult()*buffM('global');
  if(has('harmony')) global*=3;
  if(has('starmap')) global*=2;
  if(has('ancient')) global*=10;
  if(S.world.bridge) global*=1.5;
  D.global=global;
  const rm={};
  const resR={wood:'lumber',stone:'masonry',fish:'bait',fruit:'compost'};
  for(const r of [...BASIC,'parts']){
    let x=(isl.mult[r]||1)*(1+g[r])*global;
    const lv=toolLvOf(r); if(lv>=1) x*=Math.pow(1.25,lv-1);
    if(resR[r]&&has(resR[r])) x*=2;
    if((r==='fish'||r==='fruit')&&has('tidal')) x*=3;
    if(r==='fish') x*=buffM('fish'); else if(r!=='parts') x*=buffM('other');
    rm[r]=x;
  }
  D.rm=rm;
  const hm=(1+0.25*S.fac.hut)*(1+g.helper);
  const fm=(1+0.1*S.fac.wheel)*(1+g.fac)*(S.fac.light&&nightFactor>0.5?1.5:1);
  D.hm=hm; D.fm=fm;
  const gross={wood:0,stone:0,fish:0,fruit:0,parts:0};
  const hx={monkey:(has('bananas')?3:1)*(has('elder')?5:1),robot:has('robotics')?3:1,drone:has('aero')?3:1};
  D.hProd={}; D.hRes={};
  const t=now();
  for(const h of HELPERS){
    const st=S.helpers[h.id]; D.hRes[h.id]={};
    if(!st.n){ D.hProd[h.id]=0; continue; }
    const k=st.n*hm*Math.pow(1.5,st.lv-1)*msMult(st.n)*hx[h.id]*(st.boost>t?2:1);
    D.hProd[h.id]=k;
    for(const r in h.prod){ const v=h.prod[r]*k*cmdWeight(h,r)*rm[r]; D.hRes[h.id][r]=v; gross[r]+=h.prod[r]*k*cmdWeight(h,r); }
  }
  const irr=has('irrigation')?3:1;
  D.fRes={};
  for(const f of FACS){
    const n=S.fac[f.id]; if(!n||!f.prod) continue;
    let k=n*fm*msMult(n); if(f.id==='field'||f.id==='pier') k*=irr;
    D.fRes[f.id]={};
    for(const r in f.prod){ gross[r]+=f.prod[r]*k; D.fRes[f.id][r]=f.prod[r]*k*rm[r]; }
  }
  for(const r in gross) gross[r]*=rm[r];
  const follow=HELPERS.some(h=>S.helpers[h.id].n>0&&S.helpers[h.id].cmd==='follow');
  const tapM=(has('sharp')?2:1)*(1+g.tap)*(follow?1.5:1)*2;
  D.tap={};
  for(const r of BASIC) D.tap[r]=(1+toolLvOf(r))*tapM*rm[r];
  D.autotap=g.autotap;
  if(g.autotap>0) for(const r of BASIC) gross[r]+=D.tap[r]*g.autotap*0.25;
  for(const r of BASIC) D.tap[r]+=0.05*gross[r];
  D.shopRate=S.fac.shop>0? S.fac.shop*0.5*(has('gears')?2:1)*fm*msMult(S.fac.shop)*rm.parts:0;
  D.cw=partCost();
  D.gross=gross;
  const net={...gross};
  if(S.shopOn&&D.shopRate>0){ net.parts+=D.shopRate; net.wood-=D.shopRate*D.cw; net.stone-=D.shopRate*D.cw; }
  D.net=net;
  D.shellMult=(has('shellcraft')?2:1)*(1+g.shell)*(isl.mult.shell||1)*(1+0.05*m.flower)*(m.trips>=15?2:1)*(has('ancient')?2:1);
  D.shellRate=(0.02+0.03*S.fac.tower+0.2*S.fac.light)*D.shellMult;
  D.offH=Math.min(72,4+g.offline+Math.min(24,0.5*m.flower)+(m.trips>=8?12:0));
  D.evMult=(isl.ev||1)*(has('weather')?0.7:1)/(1+g.event)*(1-Math.min(0.3,0.03*S.fac.tower))*(S.fac.light?0.7:1);
  return D;
}
function add(r,v){
  if(!(v>0)) return;
  S.res[r]=fix(S.res[r]+v);
  S.stats.got[r]=fix(S.stats.got[r]+v);
  if(BASIC.includes(r)){ S.run.earned=fix(S.run.earned+v); S.stats.earned=fix(S.stats.earned+v); }
}
function produce(dt,D){
  D=D||calc();
  for(const r of BASIC) add(r,D.gross[r]*dt);
  add('parts',D.gross.parts*dt);
  if(S.shopOn&&D.shopRate>0){
    let want=D.shopRate*dt;
    want=Math.min(want,S.res.wood/D.cw,S.res.stone/D.cw);
    if(want>0){ S.res.wood-=want*D.cw; S.res.stone-=want*D.cw; add('parts',want); }
  }
  add('shell',D.shellRate*dt);
  for(const h of HELPERS){ const st=S.helpers[h.id]; if(st.cmd==='rest'&&st.n) st.morale=Math.min(1,st.morale+dt/90); }
}

/* ================= 建設・雇用 ================= */
function costMod(){ return has('massprod')?0.75:1; }
function ownedOf(k,id){ return k==='fac'?S.fac[id]:S.helpers[id].n; }
function defOf(k,id){ return (k==='fac'?FACS:HELPERS).find(x=>x.id===id); }
function bulkCost(def,n,q){
  let nn=n; const sc=def.id==='light'?goalMult():1;
  if(def.id==='monkey'&&S.meta.trips>=1) nn=Math.max(0,n-1);
  const f=Math.pow(def.g,nn)*(Math.pow(def.g,q)-1)/(def.g-1)*costMod()*sc;
  const c={}; for(const r in def.cost) c[r]=def.cost[r]*f; return c;
}
function maxBuy(def,n){
  let q=Infinity;
  for(const r in def.cost){
    const c0=bulkCost(def,n,1)[r];
    const k=Math.floor(Math.log(S.res[r]*(def.g-1)/c0+1)/Math.log(def.g)+1e-9);
    q=Math.min(q,k);
  }
  q=Math.max(0,Math.min(q,1000));
  while(q>0&&!canPay(bulkCost(def,n,q))) q--;
  return q;
}
function buyQty(def,n){ const m=S.buyMode; if(m==='max') return Math.max(1,maxBuy(def,n)); return m; }
function buyItem(k,id,qOverride){
  const def=defOf(k,id); if(!def||!def.unlock()) return false;
  if(def.area==='east'&&!S.world.bridge) return false;
  const n=ownedOf(k,id); const q=qOverride||buyQty(def,n);
  const c=bulkCost(def,n,q); if(!canPay(c)) return false;
  pay(c);
  if(k==='fac') S.fac[id]+=q; else S.helpers[id].n+=q;
  return q;
}
function toolCost(t){
  const lv=S.tools[t.id]; const f=lv===0?1:8*Math.pow(6,lv-1);
  const c={}; for(const r in t.cost) c[r]=t.cost[r]*f;
  if(lv>=7) c.parts=10*Math.pow(5,lv-7);
  return c;
}
function buyTool(id){
  const t=TOOLS.find(x=>x.id===id); if(S.tools[id]>=TOOL_MAX) return false;
  const c=toolCost(t); if(!canPay(c)) return false;
  pay(c); S.tools[id]++; return true;
}
function helperLvCost(id){ const h=HELPERS.find(x=>x.id===id); const c=h.lv(S.helpers[id].lv); for(const r in c) c[r]*=costMod(); return c; }
function lvHelper(id){
  const st=S.helpers[id]; if(!st.n||st.lv>=50) return false;
  const c=helperLvCost(id); if(!canPay(c)) return false;
  pay(c); st.lv++; return true;
}
function resCost(node){ const f=(S.meta.trips>=4?0.75:1); const c={}; for(const r in node.cost) c[r]=node.cost[r]*f; return c; }
function resAvail(node){ return node.req.every(has)&&(!node.needBridge||S.world.bridge>0)&&(!node.needTablet||S.world.shards>=3); }
function resLockText(node){
  const p=[];
  const miss=node.req.filter(r=>!has(r)); if(miss.length) p.push('前提：'+miss.map(r=>RESEARCH.find(x=>x.id===r).name).join('・'));
  if(node.needBridge&&!S.world.bridge) p.push('東の小島へ橋を架ける');
  if(node.needTablet&&S.world.shards<3) p.push(`石板の欠片 ${S.world.shards}/3`);
  return p.join('／');
}
function doResearch(id){
  const node=RESEARCH.find(x=>x.id===id); if(has(id)||!resAvail(node)) return false;
  const c=resCost(node); if(!canPay(c)) return false;
  pay(c); S.research[id]=1; return true;
}
const GOAL_SCALE=200;
function goalMult(){ return Math.pow(GOAL_SCALE,S.meta.trips); }
function shipCost(i){ const f=goalMult()*(has('shipwright')?0.5:1)*(has('starmap')?0.5:1); const c={}; for(const r in SHIP[i].cost) c[r]=SHIP[i].cost[r]*f; return c; }
function resortCost(i){ const f=goalMult()*(has('tourism')?0.5:1)*(has('starmap')?0.5:1); const c={}; for(const r in RESORT[i].cost) c[r]=RESORT[i].cost[r]*f; return c; }
function bridgeCost(){ const f=goalMult(); const c={}; for(const r in BRIDGE_COST) c[r]=BRIDGE_COST[r]*f; return c; }
function bridgeOpen(){ return has('harmony')||S.meta.trips>=3; }
function prestigePts(){ const l=Math.log10(Math.max(1,S.run.earned))-12-S.meta.trips*Math.log10(GOAL_SCALE)*0.8; return Math.max(1,Math.floor(l>0?(l+1)*(l+1)*2:1)); }
function autoUnlocked(k){ return k==='helper'?(has('clockwork')||S.meta.trips>=5):(has('massprod')||S.meta.trips>=5); }
function autoBuy(){
  let bought=[];
  for(const k of ['helper','fac']){
    if(!S.auto[k]||!autoUnlocked(k)) continue;
    const list=k==='fac'?FACS:HELPERS;
    for(let i=0;i<20;i++){
      let best=null,bc=Infinity;
      for(const d of list){
        if(!d.unlock()||(d.area==='east'&&!S.world.bridge)) continue;
        if(k==='fac'&&ownedOf(k,d.id)===0) continue; // 初回の建設は現地で
        const c=bulkCost(d,ownedOf(k,d.id),1);
        if(!canPay(c)) continue;
        let tot=0; for(const r in c) tot+=c[r]/Math.max(1,S.res[r]);
        if(tot<bc){bc=tot;best=d;}
      }
      if(!best||bc>0.5) break;
      buyItem(k,best.id,1); bought.push(best.id);
    }
  }
  return bought;
}

/* ================= 図鑑 ================= */
function rollFrom(list,bias){
  let tot=0; const w=list.map(x=>{ const v=DEXW[x.r]*(bias&&x.r!=='N'?bias:1); tot+=v; return v; });
  let p=Math.random()*tot;
  for(let i=0;i<list.length;i++){ p-=w[i]; if(p<=0) return list[i]; }
  return list[list.length-1];
}
function catchFish(bias){
  const pool=FISH.filter(f=>f.isl==='all'||f.isl===S.run.type);
  const f=rollFrom(pool,bias);
  const isNew=!S.dex.fish[f.id];
  S.dex.fish[f.id]=(S.dex.fish[f.id]||0)+1;
  return {f,isNew};
}
function findItem(preferNew){
  let pool=ITEMS;
  if(preferNew){ const un=ITEMS.filter(x=>!S.dex.item[x.id]); if(un.length) pool=un; }
  const it=rollFrom(pool);
  const isNew=!S.dex.item[it.id];
  S.dex.item[it.id]=(S.dex.item[it.id]||0)+1;
  return {it,isNew};
}

/* ================= ガチャ ================= */
function itemProb(gid,item){
  const G=GACHA[gid]; const pr=G.rates[item.r]/100;
  const types=Object.keys(G.w).filter(t=>GITEMS.some(x=>x.t===t&&x.r===item.r));
  const wt=types.reduce((a,t)=>a+G.w[t],0);
  const cnt=GITEMS.filter(x=>x.t===item.t&&x.r===item.r).length;
  return pr*G.w[item.t]/wt/cnt;
}
function pullOne(gid){
  const G=GACHA[gid], st=S.gacha;
  st.pity[gid]++; st.pulls[gid]++; S.stats.pulls++;
  let rar;
  if(st.pity[gid]>=G.pity) rar='SSR';
  else { let p=Math.random()*100; rar='SSR'; for(const r of RARS){ p-=G.rates[r]; if(p<0){rar=r;break;} } }
  if(rar==='SSR'){ st.pity[gid]=0; S.stats.ssr++; }
  const cand=GITEMS.filter(x=>x.r===rar);
  let p=Math.random(), item=cand[cand.length-1];
  for(const it of cand){ p-=itemProb(gid,it)/(G.rates[rar]/100); if(p<0){item=it;break;} }
  const o=st.owned[item.id]; let isNew=false, refund=0;
  if(!o){ st.owned[item.id]={lv:1,cp:0}; isNew=true; }
  else if(o.lv>=GLV_MAX){ refund=DUP_REFUND[rar]; add('shell',refund); }
  else o.cp++;
  return {item,rar,isNew,refund};
}
function enhance(id){
  const o=S.gacha.owned[id]; if(!o||o.lv>=GLV_MAX||o.cp<o.lv) return false;
  o.cp-=o.lv; o.lv++; return true;
}

/* ================= イベント（ロジック） ================= */
function scheduleEvent(D){ S.ev.next=now()+rnd(150,270)*1000*(D||calc()).evMult; }
function makeEvent(){
  if(S.ev.first){ S.ev.first=false; return {type:'drift'}; }
  const r=Math.random();
  return {type:r<0.45?'drift':r<0.7?'storm':'merchant'};
}
function secProd(D,r,sec,min){ return Math.max(min||0,(D.gross[r]+(r==='parts'?D.shopRate:0))*sec); }

/* ================= 周回（ロジック） ================= */
function departReset(kind,type){
  const pts=prestigePts(); const m=S.meta;
  if(kind==='ship'){ m.compass+=pts; m.ships++; } else { m.flower+=pts; m.resorts++; }
  m.trips++; m.visited[type]=1;
  const I=ISLANDS[type];
  const names=I.names.filter(n=>n!==S.run.name);
  const name=names[Math.floor(Math.random()*names.length)];
  S.res={wood:0,stone:0,fish:0,fruit:0,parts:0,shell:S.res.shell};
  S.tools={axe:1,basket:1,pick:1,rod:1};
  for(const f of FACS) S.fac[f.id]=0;
  for(const h of HELPERS){ const c=S.helpers[h.id].cmd; S.helpers[h.id]={n:0,lv:1,cmd:c==='rest'?'bal':c,morale:0,boost:0}; }
  S.helpers.monkey.n=1;
  const keep={};
  if(m.trips>=12) for(const r of RESEARCH) if(r.t===1&&S.research[r.id]) keep[r.id]=1;
  S.research=keep;
  S.ship=[0,0,0,0,0]; S.resort=[0,0,0,0,0];
  S.world={bridge:0,shards:0,tablet:0,ruinHits:0};
  S.flags.tabletSeen=false;
  S.buffs=[]; S.stormAt=0;
  S.run={type,name,earned:0,start:now(),taps:0,seed:1+Math.floor(Math.random()*9999)};
  S.ev.pending=null; scheduleEvent();
  S.player=null; S.obj={}; S.actors=null;
  if(m.trips>=5){ S.auto.helper=true; S.auto.fac=true; }
  return {pts,name,I};
}

/* ================= map: タイルマップ・オブジェクト・衝突・経路 ================= */
const T=32, MW=50, MH=32;
const DEEP=0,SHAL=1,SAND=2,GRASS=3,FOREST=4,ROCKG=5,CLIFF=6,POND=7,DIRT=8,BRIDGE=9,PLANK=10;
const PRIO={0:0,1:0,7:0,9:0,2:2,10:2,8:3,3:4,4:4.5,5:5,6:6};
const isWater=t=>t===DEEP||t===SHAL||t===POND||t===BRIDGE;
let tiles=null, area=null, blockObj=null, OBJ=[], OBJID={}, SITES={}, FISHSPOTS=[], SHORE=[], ISL={};
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hash2(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>>13))*1274126177; return ((h^(h>>>16))>>>0)/4294967296; }
const tileAt=(x,y)=>(x<0||y<0||x>=MW||y>=MH)?DEEP:tiles[y*MW+x];
function setT(x,y,v){ if(x>=0&&y>=0&&x<MW&&y<MH) tiles[y*MW+x]=v; }

function genMap(){
  const type=S.run.type, R=mulberry(S.run.seed*9973+type.length*17);
  tiles=new Uint8Array(MW*MH); area=new Uint8Array(MW*MH);
  const M={cx:21,cy:16,rx:16,ry:11}, I={cx:44,cy:14,rx:4.6,ry:5.2};
  ISL={M,I};
  const ph=[R()*6,R()*6,R()*6,R()*6];
  const dist=(o,x,y,amp)=>{ const dx=(x-o.cx)/o.rx, dy=(y-o.cy)/o.ry, a=Math.atan2(dy,dx);
    const r=1+amp*(0.08*Math.sin(3*a+ph[0])+0.05*Math.sin(5*a+ph[1])+0.035*Math.sin(8*a+ph[2])); return Math.hypot(dx,dy)/r; };
  const cliffR=type==='volcano'?1.6:1;
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const px=x+0.5,py=y+0.5;
    const dm=dist(M,px,py,1), di=dist(I,px,py,0.6);
    let t=DEEP;
    if(dm<1){
      t=GRASS;
      if(dm>0.8||py>M.cy+6.2) t=SAND;
      else if(px<M.cx-3.5+1.6*Math.sin(py*0.9+ph[3])&&py<M.cy+0.5+1.2*Math.sin(px*0.8)) t=FOREST;
      else if(px>M.cx+4+1.4*Math.sin(py*1.1+ph[2])&&py<M.cy-1+1.3*Math.sin(px*0.7+ph[1])&&dm<0.82) t=ROCKG;
      if(t===ROCKG&&Math.pow((px-(M.cx+8.5))/(3*cliffR),2)+Math.pow((py-(M.cy-6.5))/(2*cliffR),2)<1) t=CLIFF;
    }else if(di<1){
      t=GRASS; area[y*MW+x]=1;
      if(di>0.72) t=SAND; else if(px>I.cx+0.8) t=ROCKG;
    }else if(dm<1.22||di<1.3) t=SHAL;
    if(t===SHAL&&di<1.3) area[y*MW+x]=1;
    tiles[y*MW+x]=t;
  }
  // 遺跡（小島中央）
  for(let y=13;y<=15;y++) for(let x=42;x<=44;x++) setT(x,y,DIRT);
  // 池と小川
  for(let y=15;y<=21;y++) for(let x=8;x<=16;x++){ if(Math.pow((x+0.5-12)/2.4,2)+Math.pow((y+0.5-18)/1.7,2)<1) setT(x,y,POND); }
  for(let x=0;x<12;x++){ const t=tileAt(x,18); if(t===POND) break; if(t!==DEEP&&t!==SHAL) setT(x,18,POND); }
  let pl=-1; for(let x=4;x<10;x++){ if(tileAt(x,18)===POND&&tileAt(x,17)!==POND&&!isWater(tileAt(x,17))&&!isWater(tileAt(x,19))){ pl=x; } }
  if(pl<0) pl=7; setT(pl,18,PLANK);
  // キャンプ広場
  for(let y=21;y<=24;y++) for(let x=18;x<=25;x++){ if(!isWater(tileAt(x,y))&&!((x===18||x===25)&&(y===21||y===24))) setT(x,y,DIRT); }
  // 橋（本島東端 → 小島西端、y=14）
  let bx0=-1,bx1=-1; for(let x=M.cx;x<MW;x++){ if(isWater(tileAt(x,14))&&bx0<0&&area[14*MW+x]===0&&!isWater(tileAt(x-1,14))) bx0=x; if(bx0>=0&&!isWater(tileAt(x,14))&&area[14*MW+x]===1){ bx1=x-1; break; } }
  if(bx0<0){ bx0=38; bx1=39; }

    if(mag>0.15){ const m=Math.min(1,mag); mx=ix/mag*m; my=iy/mag*m; }
    else if(p.path&&p.path.length){
      const n=p.path[0]; const dx=n.x-p.x, dy=n.y-p.y, d=Math.hypot(dx,dy);
      if(d<3){ p.path.shift(); if(!p.path.length) arrive(); }
      else { mx=dx/d; my=dy/d; }
    }
  }
  if(mx||my){
    const sp=PSPEED*dt;
    const nx=p.x+mx*sp, ny=p.y+my*sp;
    const pathing=!!(p.path&&p.path.length);
    if(canStand(nx,p.y)||pathing&&walkablePx(nx,p.y)) p.x=nx;
    if(canStand(p.x,ny)||pathing&&walkablePx(p.x,ny)) p.y=ny;
    if(Math.abs(mx)>Math.abs(my)) p.dir=mx<0?'left':'right'; else p.dir=my<0?'up':'down';
    p.moving=true; p.anim+=dt*(6+4*Math.min(1,Math.hypot(mx,my)));
    p.stepT=(p.stepT||0)+dt; if(p.stepT>0.32){ p.stepT=0; Sfx.play('step'); }
  } else p.moving=false;
  // アクション進行
  if(p.act){
    p.act.t+=dt;
    if(!p.act.hit&&p.act.t>=p.act.dur*0.6){ p.act.hit=true; gatherHit(p.act.o); }
    if(p.act.t>=p.act.dur){ const o=p.act.o; p.act=null;
      if(p.autoN>0&&o.kind!=='fish'&&o.hp>0){ p.autoN--; tryActionOn(o); }
      else if(p.autoN>0&&o.kind==='fish'){ p.autoN--; tryActionOn(o); }
      else if(actionHeld()) tryAction(true);
    }
  } else if(actionHeld()) tryAction(true);
  // 貝殻ひろい
  for(let i=pickups.length-1;i>=0;i--){ const k=pickups[i]; if(Math.hypot(k.x-p.x,k.y-p.y)<16){ const D=Dc||calc(); const v=Math.max(1,Math.round(rnd(1,3)*D.shellMult)); add('shell',v); popText(k.x,k.y-16,'+'+v,'i_shell','s'); burst(k.x,k.y,['#f6c8c0','#fff'],8,{lift:30}); Sfx.play('coin'); pickups.splice(i,1); hudDirty=true; } }
  // オブジェクトの再生
  const t=now();
  for(const o of OBJ){ if(o.regrowAt&&t>=o.regrowAt){ o.regrowAt=0; o.hp=o.maxhp; o.grow=0.6; } if(o.shake>0) o.shake-=dt; if(o.grow>0) o.grow-=dt; }
}
function tryActionOn(o){
  const p=objPoint(o); if(Math.hypot(p.x-player.x,p.y-player.y)>rangeOf(o)+6) return;
  if(o.kind==='fish'||o.hp>0){ player.act={o,t:0,dur:ACT_DUR[o.kind],hit:false}; faceTo(o.x,o.y); }
}
function arrive(){
  const o=player.goalObj; player.goalObj=null;
  if(!o) return;
  faceTo(o.x,o.y);
  if(o.kind==='tree'||o.kind==='rock'){ player.autoN=o.hp-1; tryActionOn(o); }
  else if(o.kind==='fish'){ player.autoN=4; tryActionOn(o); }
  else openFor(o);
}
function walkTo(wx,wy,obj){
  const sx=Math.floor(player.x/T), sy=Math.floor(player.y/T);
  let gx=Math.floor(wx/T), gy=Math.floor(wy/T);
  if(obj){ const st=standTileFor(obj,player.x,player.y); if(!st) return false; gx=st.x; gy=st.y;
    if(Math.hypot(objPoint(obj).x-player.x,objPoint(obj).y-player.y)<=rangeOf(obj)){ player.path=null; player.goalObj=obj; arrive(); return true; } }
  if(!walkable(gx,gy)){
    let best=null,bd=1e9; for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){ if(walkable(gx+dx,gy+dy)){ const d=Math.hypot(dx,dy); if(d<bd){bd=d;best=[gx+dx,gy+dy];} } }
    if(!best) return false; gx=best[0]; gy=best[1];
  }
  const path=findPath(sx,sy,gx,gy);
  if(!path) return false;
  if(!obj&&path.length) path[path.length-1]={x:clamp(wx,gx*T+6,gx*T+T-6),y:clamp(wy,gy*T+6,gy*T+T-6)};
  player.path=path; player.goalObj=obj||null; player.act=null; player.autoN=0;
  if(!path.length&&obj) arrive();
  return true;
}

const VIS_MAX={monkey:8,robot:5,drone:4};
function stockPos(){ const s=OBJID.stock; return {x:s.x,y:s.y+18}; }
function syncActors(){
  for(const h of HELPERS){
    const want=Math.min(VIS_MAX[h.id],S.helpers[h.id].n);
    let have=actors.filter(a=>a.type===h.id);
    while(have.length<want){ const a=spawnActor(h.id,have.length); actors.push(a); have.push(a); }
    while(have.length>want){ const a=have.pop(); actors.splice(actors.indexOf(a),1); }
  }
}
function spawnActor(type,i,from){
  let x,y;
  const saved=(S.actors||[]).filter(a=>a.type===type)[i];
  if(saved&&(type==='drone'||canStand(saved.x,saved.y,3))){ x=saved.x; y=saved.y; }
  else if(from){ x=from.x; y=from.y; }
  else if(type==='monkey'){ x=11*T+rnd(-20,20); y=12*T; if(!canStand(x,y,3)){ const s=stockPos(); x=s.x+rnd(-20,20); y=s.y; } }
  else { const s=OBJID.site_shop; x=s.x+rnd(-16,16); y=s.y+20; }
  if(type!=='drone'&&!canStand(x,y,3)){ const s=stockPos(); x=s.x; y=s.y; }
  return {kind:'actor',type,x,y,dir:'down',state:'idle',t:rnd(0,1),path:null,target:null,res:null,acc:0,anim:rnd(0,4),flip:false,h:type==='drone'?18:0,carry:saved&&saved.state==='carry'?saved.res:null};
}
function chooseRes(a){
  const h=HELPERS.find(x=>x.id===a.type), st=S.helpers[a.type];
  const opts=Object.keys(h.prod).filter(r=>r!=='parts'||a.type==='drone');
  let tot=0; const w=opts.map(r=>{ const v=h.prod[r]*cmdWeight(h,r)*(r==='parts'?150:1); tot+=v; return v; });
  let p=Math.random()*tot; for(let i=0;i<opts.length;i++){ p-=w[i]; if(p<=0) return opts[i]; }
  return opts[0];
}
function pickTarget(a,res){
  let list;
  if(res==='wood') list=OBJ.filter(o=>o.kind==='tree'&&o.res==='wood'&&objAvailable(o));
  else if(res==='fruit') list=OBJ.filter(o=>o.kind==='tree'&&o.res==='fruit'&&objAvailable(o));
  else if(res==='stone') list=OBJ.filter(o=>o.kind==='rock'&&objAvailable(o));
  else if(res==='fish') list=FISHSPOTS.filter(objAvailable);
  else if(res==='parts') list=[OBJID.site_shop];
  if(!list||!list.length) return null;
  const busy=new Set(actors.filter(x=>x!==a&&x.target).map(x=>x.target));
  list=list.map(o=>({o,d:Math.hypot(o.x-a.x,o.y-a.y)+(busy.has(o)?200:0)+(o.hp<=0&&o.kind!=='fish'?300:0)+rnd(0,120)})).sort((x,y)=>x.d-y.d);
  return list[0].o;
}
function actorMoveTo(a,x,y,dt,speed){
  const dx=x-a.x, dy=y-a.y, d=Math.hypot(dx,dy);
  if(d<2) return true;
  const s=Math.min(d,speed*dt); a.x+=dx/d*s; a.y+=dy/d*s;
  if(Math.abs(dx)>Math.abs(dy)) a.dir=dx<0?'left':'right'; else a.dir=dy<0?'up':'down';
  a.anim+=dt*7; return false;
}
function followPath(a,dt,speed){
  if(!a.path||!a.path.length) return true;
  const n=a.path[0]; if(actorMoveTo(a,n.x,n.y,dt,speed)) a.path.shift();
  return !a.path.length;
}
function routeTo(a,x,y){
  if(a.type==='drone'){ a.path=[{x,y}]; return true; }
  const p=findPath(Math.floor(a.x/T),Math.floor(a.y/T),Math.floor(x/T),Math.floor(y/T));
  if(p){ if(p.length) p[p.length-1]={x,y}; a.path=p; return true; }
  a.path=[{x,y}]; return false;
}
function updateActors(dt){
  const D=Dc||calc();
  for(const a of actors){
    const st=S.helpers[a.type]; const sp=a.type==='robot'?46:a.type==='drone'?70:58;
    a.t-=dt; a.anim+=a.state==='work'?dt*5:0;
    if(st.cmd==='rest'){
      if(a.state!=='rest'&&a.state!=='torest'){ const home=S.fac.hut?OBJID.site_hut:OBJID.site_fire; a.state='torest'; routeTo(a,home.x+rnd(-26,26),home.y+16+rnd(0,10)); }
      if(a.state==='torest'&&followPath(a,dt,sp)) a.state='rest';
      if(a.state==='rest'&&Math.random()<dt*0.8) parts.push({x:a.x+4,y:a.y-26,vx:6,vy:-12,g:0,life:1.4,t:0,c:'z',s:1});
      continue;
    } else if(a.state==='rest'||a.state==='torest'){ a.state='idle'; if(st.morale>0){ st.boost=now()+st.morale*60000; st.morale=0; toast(`${HELPERS.find(h=>h.id===a.type).name}たちが元気いっぱいに働き始めました（2倍）`); } }
    if(st.cmd==='follow'&&a.type!=='drone'){
      const i=actors.filter(x=>x.type===a.type).indexOf(a);
      const ang=i*1.3+(a.type==='robot'?2:0), tx=player.x+Math.cos(ang)*26, ty=player.y+Math.sin(ang)*14+8;
      const d=Math.hypot(tx-a.x,ty-a.y);
      a.state=player.act?'work':(d>6?'walk':'idle');
      if(d>200){ a.x=player.x; a.y=player.y+10; }
      else if(d>6) actorMoveTo(a,tx,ty,dt,Math.max(sp,PSPEED*1.05));
      if(player.act) a.dir=player.dir;
      continue;
    }
    switch(a.state){
      case 'idle':
        if(a.t>0) break;
        if(a.carry){ const s=stockPos(); routeTo(a,s.x+rnd(-14,14),s.y+rnd(-4,6)); a.state='carry'; break; }
        a.res=chooseRes(a); a.target=pickTarget(a,a.res);
        if(!a.target){ a.t=2; break; }
        if(a.type==='drone'){ const o=a.target; routeTo(a,o.x+rnd(-10,10),o.y-(o.kind==='fish'?4:24)); }
        else { const stt=standTileFor(a.target,a.x,a.y); if(!stt){ a.t=1; break; } routeTo(a,(stt.x+0.5)*T+rnd(-5,5),(stt.y+0.5)*T+rnd(-4,4)); }
        a.state='go'; break;
      case 'go':
        if(followPath(a,dt,sp)){ a.state='work'; a.t=rnd(2.5,4.5); a.hitT=0; if(a.target) { const dx=a.target.x-a.x; a.dir=Math.abs(dx)>4?(dx<0?'left':'right'):'up'; } }
        break;
      case 'work': {
        a.hitT=(a.hitT||0)-dt;
        const o=a.target;
        if(a.hitT<=0&&o){ a.hitT=0.6;
          if(o.kind==='tree'){ o.shake=0.25; if(onScreen(o.x,o.y)) burst(o.x,o.y-28,['#5d8a2c','#8fbf3a'],2,{lift:10}); }
          else if(o.kind==='rock'){ o.shake=0.2; if(onScreen(o.x,o.y)) burst(o.x,o.y-10,['#cfcfc4','#ffd84a'],3,{lift:30}); }
          else if(o.kind==='fish'&&onScreen(o.x,o.y)) burst(o.x,o.y,['#e8fbff','#9ae0f8'],3,{up:true,lift:6,g:100});
          if(a.type==='monkey'&&S.helpers.monkey.cmd==='care'&&o.kind==='tree'&&o.hp<o.maxhp){ o.hp=o.maxhp; o.regrowAt=0; o.grow=0.6; }
        }
        if(a.t<=0){ a.carry=a.res; const s=stockPos(); routeTo(a,s.x+rnd(-14,14),s.y+rnd(-4,6)); a.state='carry'; }
        break; }
      case 'carry':
        if(followPath(a,dt,sp*0.9)){
          // 降ろす：この助手の担当分の生産量を表示
          const vis=Math.max(1,actors.filter(x=>x.type===a.type).length);
          const rate=(D.hRes[a.type][a.carry]||0)/vis;
          const amt=rate*(a.lastDrop?Math.min(30,(now()-a.lastDrop)/1000):8);
          a.lastDrop=now();
          if(amt>0&&onScreen(a.x,a.y)){ popText(a.x,a.y-(a.type==='drone'?40:30),'+'+fmt(Math.max(1,amt)),RI[a.carry].i,'p'); if(Math.random()<0.5) Sfx.play('drop'); }
          a.carry=null; a.state='idle'; a.t=rnd(0.3,1.2);
        }
        break;
      default: a.state='idle';
    }
  }

  for(const c of critters){

}

/* ---------- 地図オブジェクトから開く ---------- */
function openFor(o){
  switch(o.kind){
    case 'bench': openPanel('bench'); break;
    case 'site': if(o.fac==='harbor') openPanel('harbor'); else openPanel('site',o.fac); break;
    case 'bridge': openPanel('bridge'); break;
    case 'tablet': openPanel('tablet'); break;
    case 'actor': openPanel('helper',o.type); break;
    case 'ev': openEvent(); break;
  }
}

let modalOpen=false; const mq=[];
function modal(html,o){
  o=o||{};

  const m=$('#modal'); m.className='show'; m.innerHTML=`<div class="mbox board ${o.cls||''}">${html}</div>`; modalOpen=true;

}
function closeModal(){
  const m=$('#modal'); m.className='hidden'; m.innerHTML=''; modalOpen=false;

  let down=null;
  cv.addEventListener('pointerdown',e=>{ Sfx.unlock(); if(e.pointerType!=='mouse') touchMode=true; down={x:e.clientX,y:e.clientY,t:performance.now()}; });
  cv.addEventListener('pointerup',e=>{
    if(!down) return; const d=Math.hypot(e.clientX-down.x,e.clientY-down.y); const dt=performance.now()-down.t; down=null;
    if(d>14||dt>700||uiBlocking()) return;
    const w=s2w(e.clientX,e.clientY);
    let best=null,bd=1e9;
    for(const o of interactables()){ const p=objPoint(o); const hy=o.kind==='tree'?p.y-22:o.kind==='site'?p.y-16:o.kind==='actor'?p.y-12:p.y-8; const r=o.kind==='site'?(o.fw||1)*16+8:o.kind==='tree'?20:16; const dd=Math.hypot(w.x-p.x,w.y-hy); if(dd<r&&dd<bd){bd=dd;best=o;} }
    if(best){ if(best.kind==='actor'&&Math.hypot(best.x-player.x,best.y-player.y)<70){ openFor(best); return; } walkTo(best.x,best.y,best); marker={x:best.x,y:best.y,t:0.6}; }
    else if(walkTo(w.x,w.y,null)) marker={x:w.x,y:w.y,t:0.6};
  });
  document.addEventListener('click',e=>{
    const ob=e.target.closest('[data-open]'); if(ob){ Sfx.unlock(); if(panel&&panel.kind===ob.dataset.open) closePanel(); else openPanel(ob.dataset.open); return; }
    const tb=e.target.closest('#ptabs [data-tab]'); if(tb){ panel.tab=tb.dataset.tab; renderPanel(true); Sfx.play('ui'); return; }
    if(e.target.closest('#pclose')){ closePanel(); return; }
    if(e.target.id==='panel'){ closePanel(); return; }
    if(e.target.closest('#evb')){ const ev=S.ev.pending; if(ev) openEvent(); return; }
    if(e.target.closest('#goal')){ goalClick(); return; }
    if(e.target.closest('#gacha')&&!e.target.closest('[data-act]')&&GA&&GA.phase!=='done'){ gTap(); return; }
    const a=e.target.closest('[data-act]');
    if(a&&!a.disabled&&ACT[a.dataset.act]){ Sfx.unlock(); ACT[a.dataset.act](a.dataset,a); }
  });
  document.addEventListener('contextmenu',e=>{ if(!e.target.closest('.pbody')) e.preventDefault(); });
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault());
}
let marker=null;
function goalClick(){
  const g=curGoal(); const o=guideTarget();
  if(g.a&&g.a[0]==='res'){ openPanel('research'); return; }
  if(g.a&&g.a[0]==='gacha'){ openPanel('gacha'); return; }
  if(o){ walkTo(o.x,o.y,o); return; }
  if(g.a&&(g.a[0]==='helper')) openPanel('helpers');
}
function welcome(){
  modal(`<div class="mart">${icHTML('p_idle',64)}${icHTML('t_island',64)}</div><h2>無人島へようこそ</h2><p>目が覚めると、見知らぬ島の浜辺にいました。<br><b>木に近づいて「伐採」</b>し、<b>作業台で斧</b>を作りましょう。斧の音を聞きつけて、きっと仲間が現れます。</p>
    <div class="howto"><div>${icHTML('u_stick',34)}<span><b>移動</b>：左下スティック／地図をタップ<br>PC：WASD・矢印・クリック</span></div><div>${icHTML('ui_hand',30)}<span><b>アクション</b>：右下ボタン（長押しで連続）<br>PC：E・スペース</span></div></div>
    <button class="btn big wide gold" data-act="welcomeOk">はじめる</button>`);
}

/* ================= main ================= */
function newIsland(){
  genMap(); buildTerrain();
  actors=[]; critters=[]; pickups=[]; mapEvents=[]; parts=[]; pops=[];
  initPlayer(); restoreWorld();
  Dc=calc(); syncActors(); syncCritters();
  if(S.ev.pending) placeEventObj(S.ev.pending.type);
  S.actors=null;
  updateCam(0,true); goalCache=-1; hudDirty=true;
}
function offline(sec,report){
  const D0=calc(); const cap=D0.offH*3600; const used=Math.min(sec,cap);
  if(used<1) return;
  const before={...S.res};
  S.buffs=S.buffs.filter(b=>b.until>now());
  const steps=Math.min(300,Math.max(1,Math.ceil(used/10))); const st=used/steps;
  const D=calc(); for(let i=0;i<steps;i++) produce(st,D);
  if(report&&sec>=30){
    const gains=RES.map(r=>[r,S.res[r]-before[r]]).filter(x=>x[1]>=1);
    if(!gains.length) return;
    modal(`<div class="mart">${icHTML('t_island',72)}</div><h2>おかえりなさい！</h2><p class="c">離れている間（${fmtTime(sec)}）も、島の仲間たちが働いていました。</p><div class="gain">${gains.map(([r,v])=>`<div><span>${icHTML(RI[r].i,18)} ${RI[r].n}</span><b>+${fmt(v)}</b></div>`).join('')}</div>${sec>cap?`<p class="c d">※オフライン収穫は最大${fmtR(D0.offH).replace(/\.0$/,'')}時間ぶんまでです</p>`:''}<button class="btn big wide" data-act="mclose">受け取る</button>`);
  }
}
let lastT=0, acc250=0, acc1=0, acc5=0, pickT=10, lastWall=now(), playT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const wall=now(); let gap=(wall-lastWall)/1000; lastWall=wall;
  if(gap>60){ offline(gap,true); Dc=calc(); hudDirty=true; gap=0; }
  const dt=Math.min(0.1,Math.max(0,gap));
  try{ step(dt,Math.min(gap,5)); render(dt); }catch(err){ console.warn(err); }
}
function step(dt,pdt){
  const D=calc(); Dc=D;
  if(pdt>0) produce(pdt,D);
  S.stats.play+=pdt;
  updatePlayer(dt); updateActors(dt); updateCam(dt);
  if(marker){ marker.t-=dt; if(marker.t<=0) marker=null; }
  if(S.tools.rod>0){ S.fishT+=pdt; if(S.fishT>=15){ S.fishT=0; if(Math.random()<0.35){ const c=catchFish(); if(c.isNew) toast(`新しい魚を発見！ ${icHTML('f_'+c.f.id,20)} <b>${c.f.n}</b>（ドローンや桟橋が釣りました）`,'dex'); } } }
  if(S.stormAt&&now()>=S.stormAt){
    S.stormAt=0; const msgs=[];
    for(const r of BASIC){ const v=Math.max(30,D.gross[r]/buffM('global')*180); add(r,v); msgs.push(icHTML(RI[r].i,14)+'+'+fmt(v)); }
    const it=findItem(false); msgs.push(icHTML('it_'+it.it.id,16)+it.it.n);
    toast('嵐が過ぎ、浜辺で漂着物を拾いました：'+msgs.join(' '));
  }
  pickT-=pdt; if(pickT<=0){ pickT=rnd(18,30); spawnPickup(); }
  acc250+=pdt; acc1+=pdt; acc5+=pdt;
  if(acc250>=0.25||hudDirty){ acc250=0; hudDirty=false; updateHud(); if(panel) updBinds(); }
  if(acc1>=1){
    acc1=0;
    S.buffs=S.buffs.filter(b=>b.until>now());
    const b=autoBuy(); if(b.length){ for(const id of new Set(b)) if(SITES[id]) built(id,false); syncActors(); }
    checkAch(); syncActors();
    if(!S.ev.pending&&now()>=S.ev.next){
      S.ev.pending=makeEvent(); placeEventObj(S.ev.pending.type);
      toast(`${icHTML(EVINFO[S.ev.pending.type].i,20)} ${EVINFO[S.ev.pending.type].t}！${S.ev.pending.type==='drift'?' 浜辺を探してみましょう':' 上のお知らせをタップ'}`);
      Sfx.play(S.ev.pending.type==='storm'?'thunder':'rare');
    }
  }
  if(acc5>=5){ acc5=0; save(); }
}
function boot(){
  cv=$('#cv'); ctx=cv.getContext('2d'); lcv=document.createElement('canvas'); lctx=lcv.getContext('2d');
  touchMode=matchMedia('(pointer:coarse)').matches||'ontouchstart' in window;
  document.body.classList.toggle('touch',touchMode);
  const hadSave=load();
  if(!S.ev.next) scheduleEvent();
  resize(); window.addEventListener('resize',()=>{ resize(); updateCam(0,true); });
  buildHud();
  setupInput();
  newIsland();
  updateHud();
  if(hadSave){ const gap=(now()-S.last)/1000; if(gap>5) offline(gap,true); Dc=calc(); }
  else welcome();
  lastWall=now();
  requestAnimationFrame(frame);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) save({silent:true}); });
  window.addEventListener('pagehide',()=>save({silent:true}));
  window.addEventListener('beforeunload',()=>save({silent:true}));
  window.addEventListener('freeze',()=>save({silent:true}));
  const ok=save({silent:true});
  if(!storageOK||!ok){ setTimeout(()=>{ notifySaveError(); },600); }
}
atlasImg.onload=()=>{ AW=atlasImg.naturalWidth; AH=atlasImg.naturalHeight; boot(); };
atlasImg.onerror=()=>{ document.body.innerHTML='<p style="color:#fff;padding:20px">assets/atlas.png を読み込めませんでした。index.html と assets フォルダを同じ場所に置いてください。</p>'; };
atlasImg.src='assets/atlas.png';
/* テスト・検証用（ゲーム画面には出ない） */
window.__island={
  get S(){return S;}, get player(){return player;}, get cam(){return cam;}, get actors(){return actors;}, get OBJ(){return OBJ;}, get OBJID(){return OBJID;}, get panel(){return panel;},
  get Z(){return Z;}, get mapEvents(){return mapEvents;},
  calc,add,produce,save,load:()=>{const ok=load();newIsland();return ok;},exportSaveCode,importSaveCode,get storageOK(){return storageOK;},get storageErr(){return storageErr;},fmt,suffix,itemProb,GACHA,GITEMS,FACS,HELPERS,RESEARCH,GOALS,ACT,
  buyTool,buyItem,doResearch,pullOne,doPull,prestigePts,shipCost,resortCost,bridgeCost,departReset,depart,
  findTarget,tryAction,walkTo,openPanel,closePanel,closeModal,curGoalIdx,
  _gen:genMap,_path:findPath,_stand:standTileFor,_walkable:walkable,get SITES(){return SITES;},get FISHSPOTS(){return FISHSPOTS;},
  setZoom:(z)=>{ Z=z; updateCam(0,true); },
  teleport:(x,y)=>{ player.x=x; player.y=y; player.path=null; updateCam(0,true); },
  tick:(sec)=>{ for(let i=0;i<sec*10;i++){ step(0.1,0.1); } },
  offline:(sec)=>offline(sec,true),
  forceEvent:(type)=>{ S.ev.pending={type}; placeEventObj(type); },
  get modalOpen(){return modalOpen;}, get GA(){return GA;},
};

})();

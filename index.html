/* ================= スキルウェブ（転生ポイントで広げる永続強化の図） =================
   ドラッグで移動・ホイール／ピンチで拡大縮小・タップで選択。隣が取得済みのノードだけ取れる。 */
let SKV=null;
const SK_ICON={global:'ui_star',basic:'i_wood',tap:'ui_hand',speed:'it_sandal',helper:'ui_helpers',hcost:'i_fruit',fac:'ui_build',cost:'g_hammer',voy:'boat',rp:'ui_star',shell:'i_shell',offline:'g_hourglass',flag:'u_gear'};
function skIconOf(n){ if(n.kind==='root') return 't_island'; if(n.rep) return 'ui_star'; if(n.cap) return 'g_crown'; if(n.ks) return 'it_crownI'; const k=n.fx?Object.keys(n.fx)[0]:'flag'; return SK_ICON[k]||'u_gear'; }
function openSkillWeb(){
  const el=$('#skw'); el.classList.remove('hidden');
  el.innerHTML=`<canvas id="skcv"></canvas>
    <div class="skhead"><div class="skrp">${icHTML('ui_star',22)}<b id="skrp"></b><small id="skcnt"></small></div>
      <div class="skbtns"><button class="btn" data-act="skFit">全体</button><button class="btn gold" data-act="rebirthOpen" id="skreb"></button><button class="btn" data-act="skClose">閉じる</button></div></div>
    <div class="skinfo" id="skinfo"></div>
    <div class="sklegend"><span><i class="lg own"></i>取得済み</span><span><i class="lg av"></i>取れる</span><span><i class="lg lk"></i>まだ</span><span><i class="lg ks"></i>キーストーン</span></div>`;
  const cv2=$('#skcv');
  SKV={cv:cv2,ctx:cv2.getContext('2d'),x:0,y:0,z:1,sel:null,ptr:new Map(),pinch:null,drag:null,t:0,raf:0};
  skResize(); skFit(); SKV.z=Math.max(SKV.z,Math.min(0.62,innerHeight/900)); skInfo();
  const P=SKV.ptr;
  cv2.addEventListener('pointerdown',e=>{ e.preventDefault(); cv2.setPointerCapture(e.pointerId); P.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,t:performance.now()}); if(P.size===2){ const [a,b]=[...P.values()]; SKV.pinch={d:Math.hypot(a.x-b.x,a.y-b.y),z:SKV.z}; } });
  cv2.addEventListener('pointermove',e=>{ const p=P.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(P.size>=2&&SKV.pinch){ const [a,b]=[...P.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); skZoomAt((a.x+b.x)/2,(a.y+b.y)/2,SKV.pinch.z*d/SKV.pinch.d/SKV.z); }
    else { SKV.x-=dx/SKV.z; SKV.y-=dy/SKV.z; } });
  const up=e=>{ const p=P.get(e.pointerId); P.delete(e.pointerId); if(P.size<2) SKV.pinch=null; if(!p) return;
    if(Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8&&performance.now()-p.t<500) skTap(e.clientX,e.clientY); };
  cv2.addEventListener('pointerup',up); cv2.addEventListener('pointercancel',up);
  cv2.addEventListener('wheel',e=>{ e.preventDefault(); skZoomAt(e.clientX,e.clientY,e.deltaY<0?1.15:1/1.15); },{passive:false});
  window.addEventListener('resize',skResize);
  const loop=()=>{ if(!SKV) return; SKV.raf=requestAnimationFrame(loop); skDraw(); };
  loop();
  if(player){ player.act=null; player.path=null; }
}
function closeSkillWeb(){ if(!SKV) return; cancelAnimationFrame(SKV.raf); window.removeEventListener('resize',skResize); SKV=null; const el=$('#skw'); el.classList.add('hidden'); el.innerHTML=''; }
function skResize(){ if(!SKV) return; const d=Math.min(2,window.devicePixelRatio||1); SKV.d=d; SKV.cv.width=Math.round(innerWidth*d); SKV.cv.height=Math.round(innerHeight*d); }
function skFit(){ if(!SKV) return; let r=0; for(const n of SKW.N) r=Math.max(r,Math.abs(n.x),Math.abs(n.y)); r+=150; SKV.z=Math.min(innerWidth,innerHeight-90)/(2*r); SKV.x=0; SKV.y=0; }
function skZoomAt(sx,sy,k){ const z0=SKV.z, z1=clamp(z0*k,0.25,3); const w=skS2W(sx,sy); SKV.z=z1; const w2=skS2W(sx,sy); SKV.x+=w.x-w2.x; SKV.y+=w.y-w2.y; }
function skS2W(sx,sy){ return {x:(sx-innerWidth/2)/SKV.z+SKV.x,y:(sy-innerHeight/2-10)/SKV.z+SKV.y}; }
function skW2S(x,y){ return {x:(x-SKV.x)*SKV.z+innerWidth/2,y:(y-SKV.y)*SKV.z+innerHeight/2+10}; }
function skR(n){ return n.kind==='root'?22:n.rep?21:n.cap?19:n.ks?17:n.bridge?12:13; }
function skRS(n){ return clamp(skR(n)*SKV.z*1.25,4,30); }
function skTap(sx,sy){ const w=skS2W(sx,sy); let best=null,bd=1e9; for(const n of SKW.N){ const d=Math.hypot(n.x-w.x,n.y-w.y); if(d<(skRS(n)+10)/SKV.z&&d<bd){ bd=d; best=n; } } SKV.sel=best?best.id:null; skInfo(); if(best) Sfx.play('ui'); }
function skInfo(){

  const own=skOwned(n.id)&&!n.rep, av=skAvail(n.id), B0=BRANCHES[n.b], cst=skCost(n);
  el.innerHTML=`${icHTML(skIconOf(n),32)}<div class="bd"><div class="t">${n.n}${n.rep?`<span class="own">Lv ${skLv(n.id)}</span>`:n.ks?'<span class="own">キーストーン</span>':''}${B0?`<span class="own" style="color:${B0.c}">${B0.n}</span>`:''}</div><div class="d">${n.d}</div></div>
    ${own?'<span class="d ok">取得済み</span>':`<button class="btn big ${av&&S.meta.rp>=cst?'can':''}" data-act="skBuy" data-id="${n.id}" ${av&&S.meta.rp>=cst?'':'disabled'}>${icHTML('ui_star',14)}${fmt(cst)} ${av?(n.rep&&skLv(n.id)?'もう1レベル':'取る'):n.rep&&!skRepOpen()?'（雪の島に着くと解放）':'（隣が未取得）'}</button>`}`;

function SVsel(){ return SKV&&SKV.sel?SKW.byId[SKV.sel]:null; }
function skDraw(){
  const {cv,ctx:g,d}=SKV; SKV.t+=1/60;
  g.setTransform(1,0,0,1,0,0); g.imageSmoothingEnabled=false;
  // 背景：夜の海と星
  const gr=g.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*0.7); gr.addColorStop(0,'#1e2a48'); gr.addColorStop(1,'#0a0e1c'); g.fillStyle=gr; g.fillRect(0,0,cv.width,cv.height);
  for(let i=0;i<90;i++){ const x=hash2(i,11)*cv.width, y=hash2(i,29)*cv.height; const a=0.3+0.5*Math.abs(Math.sin(SKV.t*0.8+i)); g.fillStyle=`rgba(255,250,220,${a})`; g.fillRect(x|0,y|0,d,d); }
  g.setTransform(d,0,0,d,0,0);
  const z=SKV.z;
  // 枝の扇形
  BRANCHES.forEach((B,bi)=>{ const c=skW2S(0,0); const a0=(bi*60-90-28)*Math.PI/180, a1=(bi*60-90+28)*Math.PI/180; g.fillStyle=B.c+'14'; g.beginPath(); g.moveTo(c.x,c.y); g.arc(c.x,c.y,9.5*112*z,a0,a1); g.closePath(); g.fill();
    const p=skW2S(Math.cos((bi*60-90)*Math.PI/180)*10.25*112,Math.sin((bi*60-90)*Math.PI/180)*10.25*112); g.font=`900 ${Math.max(11,14*z)|0}px system-ui,sans-serif`; g.textAlign='center'; g.textBaseline='middle'; g.fillStyle=B.c; g.fillText(B.n,p.x,p.y); });
  // 辺
  for(const [a,b] of SKW.E){ const A=SKW.byId[a], Bn=SKW.byId[b]; const p=skW2S(A.x,A.y), q=skW2S(Bn.x,Bn.y);
    const oa=skOwned(a), ob=skOwned(b);
    g.strokeStyle=oa&&ob?'#ffd86a':(oa||ob)?'rgba(255,230,160,0.55)':'rgba(140,150,180,0.28)'; g.lineWidth=oa&&ob?3:2; g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(q.x,q.y); g.stroke(); }
  // ノード
  const sel=SKV.sel;
  for(const n of SKW.N){
    const p=skW2S(n.x,n.y); const r=skRS(n);
    if(p.x<-40||p.y<-40||p.x>innerWidth+40||p.y>innerHeight+40) continue;
    const own=skOwned(n.id), av=skAvail(n.id), can=av&&S.meta.rp>=skCost(n);
    const col=n.b>=0?BRANCHES[n.b].c:'#f2ead8';
    g.save(); g.translate(Math.round(p.x),Math.round(p.y));
    if(n.ks){ g.rotate(Math.PI/4); }
    const s=r*2*(n.ks?0.82:1);
    g.fillStyle='#120c08'; g.fillRect(-s/2-2,-s/2-2,s+4,s+4);
    g.fillStyle=own?col:av?'#3a3040':'#1e1c26'; g.fillRect(-s/2,-s/2,s,s);
    g.fillStyle=own?'rgba(255,255,255,0.35)':'rgba(255,255,255,0.08)'; g.fillRect(-s/2,-s/2,s,2);
    if(can){ g.strokeStyle=`rgba(255,230,120,${0.5+0.5*Math.sin(SKV.t*5)})`; g.lineWidth=2; g.strokeRect(-s/2-4,-s/2-4,s+8,s+8); }
    else if(av){ g.strokeStyle=col; g.lineWidth=1.5; g.strokeRect(-s/2-3,-s/2-3,s+6,s+6); }
    if(sel===n.id){ g.strokeStyle='#ffffff'; g.lineWidth=2; g.strokeRect(-s/2-6,-s/2-6,s+12,s+12); }
    g.restore();
    const ic=ATLAS[skIconOf(n)]; if(ic&&atlasImg.complete){ const k=r*1.25/Math.max(ic[2],ic[3]); g.globalAlpha=own?1:av?0.75:0.35; g.drawImage(atlasImg,ic[0],ic[1],ic[2],ic[3],Math.round(p.x-ic[2]*k/2),Math.round(p.y-ic[3]*k/2),Math.round(ic[2]*k),Math.round(ic[3]*k)); g.globalAlpha=1; }
    if((z>0.45&&n.ks)||sel===n.id){ g.font='800 10px system-ui,sans-serif'; g.textAlign='center'; g.fillStyle='rgba(10,8,6,0.75)'; const w=g.measureText(n.n).width+6; g.fillRect(p.x-w/2,p.y+r+4,w,13); g.fillStyle=own?'#ffe9a0':'#d8d0e8'; g.fillText(n.n,p.x,p.y+r+11); }
  }
}

function offline(sec,report){

  S.buffs=S.buffs.filter(b=>b.until>now());
  const steps=Math.min(300,Math.max(1,Math.ceil(used/10))); const st=used/steps;
  const D=calc(); for(let i=0;i<steps;i++) produce(st,D);
  if(report&&sec>=30){
    const gains=RES.map(r=>[r,S.res[r]-before[r]]).filter(x=>x[1]>=1);
    if(!gains.length) return;
    modal(`<div class="mart">${icHTML('t_island',72)}</div><h2>おかえりなさい！</h2><p class="c">離れている間（${fmtTime(sec)}）も、島の仲間たちが働いていました。</p><div class="gain">${gains.map(([r,v])=>`<div><span>${icHTML(RI[r].i,18)} ${RI[r].n}</span><b>+${fmt(v)}</b></div>`).join('')}</div>${sec>cap?`<p class="c d">※オフライン収穫は最大${fmtR(D0.offH).replace(/\.0$/,'')}時間ぶんまでです</p>`:''}<button class="btn big wide" data-act="mclose">受け取る</button>`);
  }
}

}
